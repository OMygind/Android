<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Huskeseddel</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom))}header{padding:22px 4px 14px;position:sticky;top:0;background:#f5f7fbee;backdrop-filter:blur(14px);z-index:5}.title{display:flex;align-items:center;justify-content:space-between}.title h1{margin:0;font-size:31px;letter-spacing:-.7px}.count{font-size:13px;color:#667085}.search{margin-top:14px;display:flex;gap:8px}.search input{flex:1;border:0;background:#fff;border-radius:14px;padding:13px 15px;font-size:16px;box-shadow:0 2px 10px #0000000b;outline:none}.actions{display:flex;gap:8px;margin:10px 0 4px;overflow:auto}.btn{border:0;border-radius:12px;padding:10px 13px;background:#2563eb;color:white;font-size:15px;white-space:nowrap}.btn.gray{background:#e9edf4;color:#263247}.group{background:#fff;border-radius:18px;margin:12px 0;box-shadow:0 3px 16px #1b2a4a0b;overflow:hidden}.gh{display:flex;align-items:center;padding:15px 15px 12px;gap:9px}.gtitle{font-size:19px;font-weight:750;flex:1}.gbtn,.ibtn{border:0;background:#eef2f7;color:#344054;border-radius:10px;width:34px;height:34px;font-size:18px}.items{padding:0 13px 13px}.item{border-top:1px solid #eef1f5;padding:8px 2px}.row{display:flex;align-items:center;gap:9px;min-height:34px}.check{width:21px;height:21px;accent-color:#2563eb}.txt{flex:1;font-size:16px;line-height:1.35}.done{text-decoration:line-through;color:#98a2b3}.subitems{margin-left:28px;border-left:2px solid #edf0f5;padding-left:8px}.empty{color:#98a2b3;text-align:center;padding:28px 10px}.modal{position:fixed;inset:0;background:#10182866;display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:white;width:min(760px,100%);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px}.sheet input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px}.sheet .buttons{display:flex;gap:8px;margin-top:12px}.sheet .buttons button{flex:1}</style></head><body><div class="app"><header><div class="title"><h1>📝 Huskeseddel</h1><span class="count" id="count"></span></div><div class="search"><input id="search" placeholder="Søg i huskesedlen…" oninput="render()"></div><div class="actions"><button class="btn" onclick="openAdd()">＋ Gruppe</button><button class="btn gray" onclick="addQuick()">＋ Punkt</button><button class="btn gray" onclick="clearDone()">Fjern udførte</button></div></header><main id="app"></main></div><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Nyt punkt</h2><input id="modalInput" autocomplete="off"><div class="buttons"><button class="btn gray" onclick="closeModal()">Annuller</button><button class="btn" onclick="confirmModal()">Gem</button></div></div></div><script>const KEY='huskeseddel-v2';let data=JSON.parse(localStorage.getItem(KEY)||'[]');let action=null;const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};const uid=()=>crypto.randomUUID();function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function find(items,id){for(const x of items){if(x.id===id)return x;const y=find(x.children,id);if(y)return y}return null}function openModal(t,fn){modalTitle.textContent=t;modalInput.value='';action=fn;modal.style.display='flex';setTimeout(()=>modalInput.focus(),50)}function closeModal(){modal.style.display='none';action=null}function confirmModal(){let v=modalInput.value.trim();if(v&&action){action(v);closeModal();save()}}function openAdd(){openModal('Ny gruppe',v=>data.push({id:uid(),name:v,items:[]}))}function addQuick(){if(!data.length){openAdd();return}openModal('Nyt punkt',v=>data[0].items.push({id:uid(),text:v,done:false,children:[]}))}function addItem(gid,parent=null){openModal('Nyt punkt',v=>{let g=data.find(g=>g.id===gid),x={id:uid(),text:v,done:false,children:[]};parent?find(g.items,parent).children.push(x):g.items.push(x)})}function edit(gid,id){let g=data.find(g=>g.id===gid),x=find(g.items,id);openModal('Redigér punkt',v=>x.text=v);modalInput.value=x.text}function renameGroup(gid){let g=data.find(g=>g.id===gid);openModal('Redigér gruppe',v=>g.name=v);modalInput.value=g.name}function del(gid,id=null){if(!confirm('Slet dette?'))return;let g=data.find(g=>g.id===gid);if(!id)data=data.filter(x=>x.id!==gid);else remove(g.items,id);save()}function remove(items,id){let i=items.findIndex(x=>x.id===id);if(i>=0){items.splice(i,1);return true}return items.some(x=>remove(x.children,id))}function toggle(gid,id){let x=find(data.find(g=>g.id===gid).items,id);x.done=!x.done;save()}function matches(x,q){return !q||x.text.toLowerCase().includes(q)||x.children.some(y=>matches(y,q))}function renderItems(gid,items,q){return items.filter(x=>matches(x,q)).map(x=>`<div class="item"><div class="row"><input class="check" type="checkbox" ${x.done?'checked':''} onchange="toggle('${gid}','${x.id}')"><span class="txt ${x.done?'done':''}">${esc(x.text)}</span><button class="ibtn" onclick="addItem('${gid}','${x.id}')">＋</button><button class="ibtn" onclick="edit('${gid}','${x.id}')">✎</button><button class="ibtn" onclick="del('${gid}','${x.id}')">×</button></div>${x.children.length?`<div class="subitems">${renderItems(gid,x.children,q)}</div>`:''}</div>`).join('')}function render(){let q=search.value.trim().toLowerCase(),total=0,done=0;function count(a){a.forEach(x=>{total++;if(x.done)done++;count(x.children)})}data.forEach(g=>count(g.items));document.getElementById('count').textContent=`${total-done} aktive`;app.innerHTML=data.map(g=>{let body=renderItems(g.id,g.items,q);return `<section class="group"><div class="gh"><span class="gtitle">${esc(g.name)}</span><button class="gbtn" onclick="addItem('${g.id}')">＋</button><button class="gbtn" onclick="renameGroup('${g.id}')">✎</button><button class="gbtn" onclick="del('${g.id}')">×</button></div><div class="items">${body||'<div class="empty">Ingen punkter</div>'}</div></section>`}).join('')||'<div class="empty">Tryk på ＋ Gruppe for at komme i gang.</div>'}function clearDone(){function c(a){for(let i=a.length-1;i>=0;i--){c(a[i].children);if(a[i].done)a.splice(i,1)}}data.forEach(g=>c(g.items));save()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
